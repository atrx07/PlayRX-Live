name: Android Build

# Builds a debug APK on every push to main and every pull request,
# and uploads it as a downloadable artifact.
#
# Signing: debug builds use a shared debug keystore so that a new APK
# installs over the previous one instead of Android refusing it with
# "package conflicts with an existing package". The keystore is stored
# as a repository secret named DEBUG_KEYSTORE_B64 (base64 of the
# keystore) and restored to ~/.android/debug.keystore before building.
# If the secret is missing, the build still succeeds with the runner's
# throwaway debug key — it just won't update in place.
#
# NOTE: GitHub Actions does not allow the `secrets` context in an `if:`
# condition, so the "secret present?" check is done inside the shell
# script below, not with `if:`. Using `if: ${{ secrets... }}` makes the
# whole workflow fail immediately at parse time.
#
# NOTE: this repo deliberately has no Gradle wrapper (gradlew). The
# wrapper JAR is a binary file that cannot go through the project's
# GitHub push tooling, so the workflow installs Gradle directly
# (8.7, which matches Android Gradle Plugin 8.5.2) instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Restore consistent debug keystore
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
          fi
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayRX-Live-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Visual QA screenshots (Paparazzi, JVM-only, no emulator needed).
  # Manual-only for now: Paparazzi tests are not yet in the repo, so this
  # job is a placeholder that records what it can and uploads whatever
  # screenshots exist. It never runs on push/PR, so it cannot break the
  # normal build. Once screenshot tests land, replace the record step
  # with a hard `gradle recordPaparazziDebug` and flip this to run on PRs.
  screenshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Record Paparazzi screenshots (placeholder until tests land)
        run: gradle recordPaparazziDebug --stacktrace || echo "Paparazzi not yet configured"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: PlayRX-screenshots
          path: app/build/paparazzi/
          if-no-files-found: warn
